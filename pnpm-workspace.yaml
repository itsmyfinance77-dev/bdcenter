packages:
  - '.'

# pnpm 12 renamed onlyBuiltDependencies -> allowBuilds (map form). Keep the
# list form too for pnpm 10 compatibility, in case a contributor pins an
# older pnpm locally.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
  - unrs-resolver

# Security overrides for transitive dependencies (pnpm audit, 2026-09-30):
# next pins postcss 8.4.x (sourceMappingURL file-read advisories); the Prisma
# CLI pulls deepmerge-ts 7.x (stack exhaustion). Both are build/CLI-time only.
overrides:
  postcss: '>=8.5.23 <9'
  deepmerge-ts: '>=8.0.0 <9'
